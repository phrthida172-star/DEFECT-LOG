            "คลังสินค้า": ["คลังกระดาษ"],

        };

        // รายการปัญหาทั้งหมดตามที่ระบุ
        const allDefectOptions = [
            "สีไม่ได้มาตรฐาน", "พิมพ์ไม่ตรง", "จุดขาว", "ขี้หมึก", "ขี้กระดาษ", "สีไม่สม่ำเสมอ", "รอยขูดขีด", "สีเลอะ", "น้ำมันกระเด็น",

        function updateMachineOptions() {
            const dept = document.getElementById('inpDept').value;
            const machineSelect = document.getElementById('inpMachine');
            machineSelect.innerHTML = '<option value="">-- เลือกเครื่องจักร --</option>';
            
            if (dept && departmentMachines[dept]) {
                departmentMachines[dept].forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    machineSelect.appendChild(opt);
                });
            } else {
                // ถ้ายังไม่เลือกแผนก ให้ดึงเครื่องจักรทั้งหมดมาแสดง
                const allMachines = ["2101", "2103", "2104", "2105", "2106", "2107", "3131", "3132", "3165", "3166", "3161", "5104", "5105", "4101", "4102", "4103", "4104", "4105", "4106", "4107", "4108", "6101", "6103", "6104", "6106", "6107", "6108", "6109", "6110", "คลังกระดาษ", "แกะ", "ทั่วไป"];
                allMachines.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    machineSelect.appendChild(opt);
                });
            }
        }

        // ฟังก์ชันเติมตัวเลือกปัญหาลงใน datalist เพื่อให้ผู้ใช้เลือกหรือพิมพ์ค้นหาได้ง่าย
        function initDefectDatalist() {
            const inputDefect = document.getElementById('inpDefect');
            if (!inputDefect) return;
            
            let datalist = document.getElementById('defectListOptions');
            if (!datalist) {
                datalist = document.createElement('datalist');
                datalist.id = 'defectListOptions';
                document.body.appendChild(datalist);
                inputDefect.setAttribute('list', 'defectListOptions');
            }
            datalist.innerHTML = allDefectOptions.map(d => `<option value="${d}">`).join('');
        }

        const MOCK_INITIAL_DATA = [
            { id: 'NC-1001', date: '2026-11-01', shift: 'กะ A', dept: 'พิมพ์สี', machine: '2101', jobNo: 'JOB-2611-01', customerJob: 'บ.ออร่าสกิน - กล่องครีมพรีเมียม', defect: 'สีไม่ได้มาตรฐาน', qty: 350, unit: 'แผ่น', operator: 'สมชาย ใจดี', reporter: 'วิภาดา QC', causeAction: 'ปรับสมดุลหมึกพิมพ์ CMYK', status: 'แก้ไขแล้ว/ปิดงาน' },
            { id: 'NC-1002', date: '2026-11-05', shift: 'กะ B', dept: 'อาบมันรีดเงา', machine: '3131', jobNo: 'JOB-2611-04', customerJob: 'บ.เนเชอรัล - กล่องสบู่สมุนไพร', defect: 'โค๊ทไม่เงา', qty: 180, unit: 'แผ่น', operator: 'ประเสริฐ เก่งมาก', reporter: 'กนกวรรณ QC', causeAction: 'เพิ่มความร้อนลูกกลิ้งเคลือบ', status: 'กำลังแก้ไข/คัดแยก' }
        ];

        window.onload = function() {
            document.getElementById('inpDate').valueAsDate = new Date();
            initDefectDatalist();
            updateMachineOptions();
            if (SHEET_WEB_APP_URL) {
                document.getElementById('scriptUrlInput').value = SHEET_WEB_APP_URL;
                fetchSheetData();
            } else {
                records = MOCK_INITIAL_DATA;
                refreshAllViews();
                showToast('โหมดจำลองข้อมูล (Demo): สามารถกดตั้งค่าลิงก์ชีตเพื่อเชื่อมต่อจริงได้', 'info');
            }
            lucide.createIcons();
        };

        function openSheetsModal() { document.getElementById('sheetsModal').classList.remove('hidden'); }
